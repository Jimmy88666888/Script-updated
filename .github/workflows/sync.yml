name: sync-upstream

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync scripts from upstream
        # 脚本按 Local/、Author/ 分目录存放，同步器位于仓库根 tools/ 下，从仓库根运行。
        run: node tools/sync.mjs

      - name: Generate docs (manifest / README / install page)
        # 说明文件由生成器统一重建：目录 + 脚本头部 + 清单里的人工说明，三处同源。
        run: node tools/gen-docs.mjs

      - name: Commit and push when changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync upstream userscripts"
          git push